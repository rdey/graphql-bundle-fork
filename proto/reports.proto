syntax = "proto3";

// Trimmed subset of Apollo's reports.proto, sufficient to emit FTV1 inline traces
// from a federated subgraph.
//
// Upstream: https://github.com/apollographql/apollo-server
//           packages/usage-reporting-protobuf/src/reports.proto
// Vendored from commit 021460e95c34ce921dc1c8caa3e5ded3463487ee (2023-03-02).
//
// FIELD NUMBERS MUST MATCH UPSTREAM EXACTLY -- they are the wire format.
// `reserved` guards the numbers of upstream fields we deliberately omit, so they
// can never be reused here by mistake. See docs/federation/inline-trace.md.
//
// Upstream declares no `package`, which would make protoc emit into the PHP global
// namespace (\Trace). The two `option php_*_namespace` lines below are this file's
// only intentional divergence from upstream.
//
// Regenerate with: composer proto
//
// Generated with protoc 29.3. protoc's PHP backend changes its output between
// releases, so use that version (CI pins it) or expect a large, spurious diff.

import "google/protobuf/timestamp.proto";

option php_namespace = "Redeye\\GraphQLBundle\\Federation\\Tracing\\Proto";
option php_metadata_namespace = "Redeye\\GraphQLBundle\\Federation\\Tracing\\Proto\\Metadata";

message Trace {
  message Error {
    string message = 1;
    repeated Location location = 2;
    uint64 time_ns = 3;
    string json = 4;
  }

  message Location {
    uint32 line = 1;
    uint32 column = 2;
  }

  // We store information on each resolver execution as a Node on a tree. The structure
  // of the tree corresponds to the structure of the GraphQL response; it does not
  // indicate the order in which resolvers were invoked. Nodes representing list indices
  // (and the root node) don't carry types or times.
  message Node {
    // The response name of the field -- i.e. the alias, when the query used one. In that
    // case original_field_name holds the actual field name from the schema. Paths are
    // always built from response_name.
    oneof id {
      string response_name = 1;
      uint32 index = 2;
    }

    // The field's return type; e.g. "String!" for User.email: String!
    string type = 3;

    // relative to the trace's start_time, in ns
    uint64 start_time = 8;
    // relative to the trace's start_time, in ns
    uint64 end_time = 9;

    repeated Error error = 11;
    repeated Node child = 12;

    // The field's parent type; e.g. "User" for User.email: String!
    string parent_type = 13;

    string original_field_name = 14;

    // Omitted upstream fields: cache_policy (5). 4 is reserved upstream too.
    reserved 4 to 7, 10;
  }

  // Wallclock time when the trace ended.
  google.protobuf.Timestamp end_time = 3;
  // Wallclock time when the trace began.
  google.protobuf.Timestamp start_time = 4;
  // High precision duration of the trace; may not equal end_time - start_time
  // (e.g. if the machine's clock changed during the trace).
  uint64 duration_ns = 11;
  // A tree containing information about all resolvers run by this service, including errors.
  Node root = 14;

  // Some servers don't do field-level instrumentation for every request and assign each
  // instrumented request a "weight". Apollo Server always sends 1 for inline traces; Studio
  // scales estimated_execution_count by it. 0 is treated as 1 for backwards compatibility.
  double field_execution_weight = 31;

  // Everything else in the upstream Trace message is a gateway / usage-reporting concern
  // and is never present in an inline trace: signature, details, client_name,
  // client_version, http, cache_policy, query_plan, full_query_cache_hit,
  // persisted_query_*, registered_operation, forbidden_operation, is_incomplete,
  // unexecutedOperation*.
  reserved 1, 2, 5 to 10, 12, 13, 15 to 30, 32, 33;
}
